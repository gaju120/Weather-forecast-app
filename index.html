<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast App</title>

    <!-- Bootstrap 5 CSS (loaded from CDN) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts: Poppins for headings/numbers, Inter for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Our custom CSS (loaded after Bootstrap so it can override it) -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container py-5">

        <!-- ===== Header ===== -->
        <header class="text-center mb-4">
            <h1 class="app-title">🌤️ Weather Forecast</h1>
            <p class="app-subtitle">Search any city to see the current weather</p>
        </header>

        <!-- ===== Search Bar ===== -->
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div class="input-group search-box mb-4">
                    <input
                      type="text"
                      id="cityInput"
                      class="form-control"
                      placeholder="Enter city name (e.g. London)"
                      aria-label="City name"
                    />
                    <button class="btn btn-search" type="button" id="searchBtn">
                        Search
                    </button>
                </div>
            </div>
        </div>

        <!-- ===== Loading Spinner (hidden until a search starts) ===== -->
        <div id="loadingSpinner" class="text-center my-5 d-none">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 app-subtitle">Fetching weather data...</p>
        </div>

        <!-- ===== Error Message (hidden until something goes wrong) ===== -->
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div id="errorMessage" class="alert alert-danger text-center d-none" role="alert">
                    City not found. Please check the spelling and try again.
                </div>
            </div>
        </div>

        <!-- ===== Weather Result Card (hidden until we have data) ===== -->
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                <div id="weatherCard" class="card weather-card d-none">
                    <div class="card-body text-center">

                        <!-- City + Country -->
                        <h2 id="cityName" class="mb-0"></h2>
                        <p id="countryName" class="app-subtitle mb-3"></p>

                        <!-- Icon + Temperature + Description -->
                        <img id="weatherIcon" src="" alt="Weather icon" class="weather-icon" />
                        <h1 id="temperature" class="temperature mb-0"></h1>
                        <p id="description" class="description text-capitalize"></p>

                        <hr class="weather-divider" />

                        <!-- Extra Details -->
                        <div class="row text-center weather-details">
                            <div class="col-4">
                                <p class="mb-1 fs-4">🌡️</p>
                                <p class="mb-0 small app-subtitle">Feels Like</p>
                                <p id="feelsLike" class="fw-semibold mb-0"></p>
                            </div>
                            <div class="col-4">
                                <p class="mb-1 fs-4">💧</p>
                                <p class="mb-0 small app-subtitle">Humidity</p>
                                <p id="humidity" class="fw-semibold mb-0"></p>
                            </div>
                            <div class="col-4">
                                <p class="mb-1 fs-4">💨</p>
                                <p class="mb-0 small app-subtitle">Wind Speed</p>
                                <p id="windSpeed" class="fw-semibold mb-0"></p>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Footer ===== -->
        <footer class="text-center app-subtitle mt-5">
            <small>Weather data provided by OpenWeatherMap</small>
        </footer>

    </div>

    <!-- Bootstrap 5 JS Bundle (needed for some Bootstrap components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Our custom JavaScript (loaded last, after all HTML exists) -->
    <script src="script.js"></script>
</body>
</html>
